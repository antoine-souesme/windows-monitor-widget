name: Tests

# Runs on every pull request: the tests need no display, so a Linux runner is
# enough. Building the package stays in the Store workflow.
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover -s tests
