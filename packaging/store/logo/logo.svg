<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c4d"/>
      <stop offset=".55" stop-color="#151538"/>
      <stop offset="1" stop-color="#241046"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".78" cy=".22" r=".6">
      <stop offset="0" stop-color="#4c6eff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4c6eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx=".1" cy=".95" r=".6">
      <stop offset="0" stop-color="#ab47bc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ab47bc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset=".55" stop-color="#ff9800"/>
      <stop offset="1" stop-color="#f44336"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="areaMask">
      <rect width="1024" height="1024" fill="url(#fade)"/>
    </mask>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="216"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowBlue)"/>
    <rect width="1024" height="1024" fill="url(#glowViolet)"/>

    <!-- Faint grid behind the graph -->
    <g stroke="#fff" stroke-opacity=".06" stroke-width="4">
      <line x1="32" y1="330" x2="992" y2="330"/>
      <line x1="32" y1="490" x2="992" y2="490"/>
      <line x1="32" y1="650" x2="992" y2="650"/>
    </g>

    <!-- Area under the curve, colored by the load scale -->
    <path d="M150 640 C 230 640, 250 560, 320 575 S 420 690, 490 600 S 600 380, 680 430 S 790 300, 874 250 L 874 760 L 150 760 Z"
          fill="url(#scale)" mask="url(#areaMask)" opacity=".75"/>

    <!-- Glow then curve -->
    <path d="M150 640 C 230 640, 250 560, 320 575 S 420 690, 490 600 S 600 380, 680 430 S 790 300, 874 250"
          fill="none" stroke="url(#scale)" stroke-width="56" stroke-linecap="round" filter="url(#blur)" opacity=".7"/>
    <path d="M150 640 C 230 640, 250 560, 320 575 S 420 690, 490 600 S 600 380, 680 430 S 790 300, 874 250"
          fill="none" stroke="url(#scale)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Live point at the end of the curve -->
    <circle cx="874" cy="250" r="70" fill="#f44336" opacity=".35" filter="url(#blur)"/>
    <circle cx="874" cy="250" r="40" fill="#fff"/>
    <circle cx="874" cy="250" r="22" fill="#f44336"/>

    <!-- Gauge underneath -->
    <rect x="150" y="810" width="724" height="40" rx="20" fill="#fff" fill-opacity=".12"/>
    <rect x="150" y="810" width="560" height="40" rx="20" fill="url(#scale)"/>
  </g>
  <rect x="34" y="34" width="956" height="956" rx="214" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
