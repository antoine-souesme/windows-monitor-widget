name: Release

# A tag v1.2.0 builds setup_1.2.0.exe on a Windows runner and attaches it to
# the GitHub release. A manual run builds the same installer and leaves it as
# a downloadable artifact, so a version can be tried before it is tagged.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $file = python -c "from monitor_widget.version import __version__; print(__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $file) {
              throw "Tag $tag does not match monitor_widget/version.py ($file)"
            }
          }
          "value=$file" >> $env:GITHUB_OUTPUT

      - name: Build the executable
        run: pyinstaller --noconfirm --clean packaging/monitor_widget.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          # The run number keeps the successive builds of a branch apart.
          name: setup_${{ steps.version.outputs.value }}_build${{ github.run_number }}
          path: dist/installer/setup_*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/setup_*.exe
          generate_release_notes: true

