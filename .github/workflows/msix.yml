name: Store package

# Builds the MSIX submitted to the Microsoft Store. A manual run leaves it as
# an artifact, so a version can be tried before it is tagged; a tag v1.2.0
# also attaches it to the GitHub release. The package is left unsigned, the
# Store signs it on ingestion.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $file = python -c "from monitor_widget.version import __version__; print(__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $file) {
              throw "Tag $tag does not match monitor_widget/version.py ($file)"
            }
          }
          "value=$file" >> $env:GITHUB_OUTPUT

      - name: Build the package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build_msix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorWidget_${{ steps.version.outputs.value }}_build${{ github.run_number }}_msix
          path: dist/store/*.msix

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/store/*.msix
          generate_release_notes: true
